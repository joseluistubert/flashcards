<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Flashcards</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 24px; }
    h1 { margin: 0 0 12px 0; }
    .row { display:flex; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid #eee; }
    .word { width: 220px; }
    button { padding: 6px 10px; }
    .top { display:flex; gap:12px; align-items:center; margin: 12px 0 18px; }
  </style>
</head>
<body>
  <h1>Flashcards</h1>

  <div class="top">
    <button id="btnRandomFav">Random (favoritos)</button>
    <button id="btnClearFav">Borrar favoritos</button>
    <span id="status"></span>
  </div>

  <div id="list"></div>

<script>
  // 1) Poné acá los nombres EXACTOS de las carpetas (una por palabra)
  const WORDS = [
    "bamay",
    // "balash",
    // "bamay2",
  ];

  const KEY = "flashcards_favs_v1";

  function loadFavs() {
    try { return JSON.parse(localStorage.getItem(KEY) || "[]"); }
    catch { return []; }
  }
  function saveFavs(favs) {
    localStorage.setItem(KEY, JSON.stringify(favs));
  }

  function render() {
    const favs = new Set(loadFavs());
    const list = document.getElementById("list");
    list.innerHTML = "";

    WORDS.forEach(w => {
      const row = document.createElement("div");
      row.className = "row";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = favs.has(w);
      cb.addEventListener("change", () => {
        const favs2 = new Set(loadFavs());
        cb.checked ? favs2.add(w) : favs2.delete(w);
        saveFavs([...favs2]);
        setStatus(`Favoritos: ${[...favs2].length}`);
      });

      const name = document.createElement("div");
      name.className = "word";
      name.textContent = w;

      const open = document.createElement("button");
      open.textContent = "Abrir";
      open.addEventListener("click", () => {
        window.location.href = `${w}/index.html`;
      });

      row.appendChild(cb);
      row.appendChild(name);
      row.appendChild(open);
      list.appendChild(row);
    });

    setStatus(`Favoritos: ${loadFavs().length}`);
  }

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  document.getElementById("btnRandomFav").addEventListener("click", () => {
    const favs = loadFavs();
    if (!favs.length) { setStatus("No hay favoritos."); return; }
    const w = favs[Math.floor(Math.random() * favs.length)];
    window.location.href = `${w}/index.html`;
  });

  document.getElementById("btnClearFav").addEventListener("click", () => {
    localStorage.removeItem(KEY);
    render();
  });

  render();
</script>
</body>
</html>
